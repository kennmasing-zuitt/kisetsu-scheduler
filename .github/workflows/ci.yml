name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: CI only checks code, it never writes to the repo
permissions:
  contents: read

# A new push to the same branch/PR cancels the run that's still going
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  checks:
    name: Format, lint & typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22 # same as the Dockerfile
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prettier
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      # next-env.d.ts is gitignored, so generate it (and Next's route types) before tsc
      - name: Generate Next.js types
        run: npx next typegen

      - name: TypeScript
        run: npm run typecheck

  build:
    name: Next.js build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Placeholders: NEXT_PUBLIC_* values are baked in at build time, but CI only
          # needs the build to succeed. Real values are set on the Droplet.
          NEXT_PUBLIC_GRAPHQL_URL: http://localhost:4000/graphql
          NEXT_PUBLIC_MOCK_API: "false"

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only build the image once the faster checks pass
    needs: [checks, build]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Builds the same image the Droplet builds (catches Dockerfile breakage) but never pushes it
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: nextjs-redux-boilerplate-client:ci
          build-args: |
            NEXT_PUBLIC_GRAPHQL_URL=http://localhost:4000/graphql
          cache-from: type=gha
          cache-to: type=gha,mode=max
