# scheduling.kisetsuspa.com -> nextjs-redux-boilerplate-client container
#
# Server block for the shared Dockerized Nginx proxy. Copy it into the proxy's
# conf.d/ folder as scheduling.conf (next to calculator.conf, authapp.conf, ...).
# Port 80 / HTTP->HTTPS is handled by the proxy's shared 00-http.conf.

server {
    listen 443 ssl;
    http2 on;
    server_name scheduling.kisetsuspa.com;

    # Certificate covering the kisetsuspa.com names (see kisetsu-booking-client/deploy/README.md)
    ssl_certificate     /etc/letsencrypt/live/kisetsuspa/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kisetsuspa/privkey.pem;

    # Docker's DNS: Nginx still starts even if this app is stopped
    resolver 127.0.0.11 valid=10s;
    # Network alias from docker-compose.yaml, reached over the shared "web" network
    set $scheduling http://nextjs-redux-boilerplate-client:3000;

    # Shared by the location below
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Everything -> Next.js
    location / {
        proxy_pass $scheduling;
    }
}
