fragment SalesLineFields on SalesLine {
    serviceId
    serviceName
    durationMin
    unitPrice
    bookings
    grossRevenue
    discounts
    revenue
}

query SalesReport($period: ReportPeriod!, $date: String!, $includeUpcoming: Boolean) {
    salesReport(period: $period, date: $date, includeUpcoming: $includeUpcoming) {
        period
        from
        to
        timeZone
        currency
        includeUpcoming
        generatedAt
        totals {
            bookings
            minutes
            grossRevenue
            discounts
            revenue
            unpriced
            requested
        }
        therapists {
            therapistId
            therapistName
            bookings
            minutes
            grossRevenue
            discounts
            revenue
            unpriced
            requested
            requestRate
            services {
                serviceId
                serviceName
                bookings
                revenue
            }
            lines {
                ...SalesLineFields
            }
        }
        services {
            serviceId
            serviceName
            isActive
            bookings
            minutes
            grossRevenue
            discounts
            revenue
            unpriced
            lines {
                ...SalesLineFields
            }
        }
        series {
            key
            bookings
            revenue
        }
        unpriced {
            bookingId
            client
            start
            durationMin
            therapistName
            serviceName
            reason
        }
        promos {
            promoId
            code
            bookings
            discounts
        }
        clients {
            uniqueClients
            newClients
            returningClients
            noClient
            top {
                clientId
                name
                mobile
                bookings
                revenue
                totalVisits
            }
        }
    }
}
