# Shared schedule shapes. Used by the therapist, room, service and booking operations.
fragment TherapistFields on Therapist {
    id
    name
    offDays
    leaveDates
}

fragment RoomFields on Room {
    id
    name
    color
}

fragment BookingFields on Booking {
    id
    client
    therapistId
    roomId
    serviceId
    start
    end
}

fragment ServicePriceFields on ServicePrice {
    id
    durationMin
    days
    amount
    validFrom
    validTo
}

fragment ServiceFields on Service {
    id
    name
    description
    isActive
    prices {
        ...ServicePriceFields
    }
}
