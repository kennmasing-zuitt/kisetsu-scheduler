# Shared schedule shapes. Used by the therapist, room, service and booking operations.
fragment TherapistFields on Therapist {
    id
    name
    offDays
    leaveDates
}

fragment RoomFields on Room {
    id
    name
    color
}

fragment BookingFields on Booking {
    id
    client
    clientId
    clientMobile
    isRequested
    promoId
    promoCode
    therapistId
    roomId
    serviceId
    start
    end
}

fragment PromoFields on Promo {
    id
    code
    description
    discountType
    value
    validFrom
    validTo
    serviceIds
    isActive
    timesUsed
    isLocked
}

fragment ServicePriceFields on ServicePrice {
    id
    durationMin
    days
    amount
    validFrom
    validTo
}

fragment ServiceFields on Service {
    id
    name
    description
    isActive
    prices {
        ...ServicePriceFields
    }
}
