mutation Register($input: RegisterInput!) {
    register(input: $input) {
        token
        user {
            ...UserFields
        }
    }
}

mutation Login($input: LoginInput!) {
    login(input: $input) {
        token
        user {
            ...UserFields
        }
    }
}

mutation Logout {
    logout
}

query Me {
    me {
        ...UserFields
    }
}

query Session {
    session {
        effectivePerms
    }
}
